name: Validate plugin bundle
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate manifests, source trees and support records
        run: python3 -B scripts/validate_bundle.py
      - name: Check rejection controls
        run: python3 -B -m unittest discover -s tests -v
